<html lang="en">
  <head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta charset="utf-8" />
    <title>Dansto</title>
    <meta name="description" content="Dan Stollenwerk solutions portfolio" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        overscroll-behavior: none;
        background: #c7e0df;
        color: #171717;
      }

      body {
        font-family: "Ubuntu", system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      #profile-motion-root {
        min-height: 100vh;
      }

      .gate-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      .gate-card {
        width: min(440px, calc(100vw - 40px));
        background: rgba(255, 255, 255, 0.36);
        border: 1px solid rgba(23, 23, 23, 0.2);
        border-radius: 16px;
        padding: 24px;
      }

      .gate-card h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }

      .gate-card p {
        margin: 0 0 16px;
        color: rgba(23, 23, 23, 0.78);
      }

      .gate-input {
        width: 100%;
        border: 1px solid rgba(23, 23, 23, 0.28);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.65);
        padding: 10px 12px;
        font: inherit;
        box-sizing: border-box;
      }

      .gate-actions {
        margin-top: 12px;
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .gate-btn {
        appearance: none;
        border: 1px solid #008080;
        background: #008080;
        color: #fff;
        border-radius: 999px;
        font: inherit;
        padding: 9px 18px;
        cursor: pointer;
      }

      .gate-error {
        color: #9a1b1b;
        font-size: 0.92rem;
        min-height: 1.2rem;
      }
    </style>
  </head>
  <body>
    <div id="profile-motion-root"></div>

    <script>
      (function () {
        const root = document.getElementById("profile-motion-root");
        const STORE_KEY = "dsto_gate_v1";

        function loadPortfolioApp() {
          function ensureBabel() {
            if (window.Babel) return Promise.resolve(window.Babel);
            return new Promise((resolve, reject) => {
              const babel = document.createElement("script");
              babel.src = "https://unpkg.com/@babel/standalone/babel.min.js";
              babel.onload = () => resolve(window.Babel);
              babel.onerror = () => reject(new Error("Failed to load Babel runtime"));
              document.body.appendChild(babel);
            });
          }

          Promise.all([
            ensureBabel(),
            fetch("profile-motion.jsx", { cache: "no-store" }).then((r) => {
              if (!r.ok) throw new Error("Failed to fetch portfolio script");
              return r.text();
            }),
          ])
            .then(([Babel, source]) => {
              const compiled = Babel.transform(source, {
                presets: ["react"],
                sourceType: "module",
              }).code;
              const app = document.createElement("script");
              app.type = "module";
              app.textContent = compiled;
              document.body.appendChild(app);
            })
            .catch((error) => {
              root.innerHTML =
                '<div class="gate-shell"><div class="gate-card"><h1>Load Error</h1><p>Could not load portfolio app.</p><p class="gate-error">' +
                String(error.message || error) +
                "</p></div></div>";
            });
        }

        function verify(input) {
          if (typeof input !== "string" || input.length !== 9) return false;
          const c = Array.from(input, (ch) => ch.charCodeAt(0));
          const s1 = c.reduce((acc, n, i) => acc + (n ^ (11 + i * 3)) * (i + 5), 0);
          const s2 = c[0] + c[2] + c[4] + c[6] + c[8];
          const s3 = (c[1] * c[3]) - c[7] + c[5];
          const p0 = (c[0] << 1) + c[8];
          const p1 = c[4] - c[1] + c[7];
          return s1 === 5579 && s2 === 484 && s3 === 5567 && p0 === 272 && p1 === 103;
        }

        if (sessionStorage.getItem(STORE_KEY) === "1") {
          loadPortfolioApp();
          return;
        }

        root.innerHTML =
          '<div class="gate-shell"><form class="gate-card" id="gate-form"><h1>Private Portfolio</h1><p>Enter password to continue.</p><input class="gate-input" id="gate-input" type="password" autocomplete="current-password" required /><div class="gate-actions"><button class="gate-btn" type="submit">Enter</button><span class="gate-error" id="gate-error"></span></div></form></div>';

        const form = document.getElementById("gate-form");
        const input = document.getElementById("gate-input");
        const error = document.getElementById("gate-error");

        form.addEventListener("submit", function (event) {
          event.preventDefault();
          if (verify(input.value)) {
            sessionStorage.setItem(STORE_KEY, "1");
            root.innerHTML = "";
            loadPortfolioApp();
          } else {
            error.textContent = "Incorrect password";
            input.value = "";
            input.focus();
          }
        });

        input.focus();
      })();
    </script>
  </body>
</html>
